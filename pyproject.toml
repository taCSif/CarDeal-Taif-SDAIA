[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saudi-used-car-deal-checker"
version = "0.1.0"
description = "ML-backed Saudi used-car price estimator with deterministic deal policy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
  "import-linter>=2.1,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --cov=src/domain --cov=src/service --cov=src/adapters --cov=src/api --cov-branch --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: tests requiring the FastAPI application", "slow: slower tests", "real_model: tests requiring the trained production model artifact"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 is the intended FastAPI dependency-injection pattern (Depends in defaults);
# routes use the Annotated form, but keep this scoped ignore documented for clarity.
per-file-ignores = { "tests/*" = ["E501"] }

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain has no outer-layer dependencies"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = ["src.service", "src.adapters", "src.api", "fastapi", "pydantic", "sklearn", "pandas", "requests", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Service stays independent of adapters and API"
type = "forbidden"
source_modules = ["src.service"]
forbidden_modules = ["src.adapters", "src.api", "fastapi", "sklearn", "pandas", "requests", "sqlalchemy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
