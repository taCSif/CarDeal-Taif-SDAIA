[project]
name = "saudi-used-car-deal-checker"
version = "0.1.0"
description = "ML-backed Saudi used-car price estimator with deterministic deal policy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
  "import-linter>=2.1,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=src/domain --cov=src/service --cov=src/adapters --cov=src/api --cov-branch --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: tests requiring the FastAPI application", "slow: slower tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Domain has no outer-layer dependencies"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = ["src.service", "src.adapters", "src.api", "fastapi", "pydantic", "sklearn", "pandas", "requests", "sqlalchemy"]
