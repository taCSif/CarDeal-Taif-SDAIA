name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: mypy src
      - run: lint-imports
      - run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download public Kaggle dataset
        run: |
          mkdir -p data/raw
          curl -L --fail --retry 3 \
            https://www.kaggle.com/api/v1/datasets/download/turkibintalib/saudi-arabia-used-cars-dataset \
            -o /tmp/saudi-used-cars.zip
          unzip -o /tmp/saudi-used-cars.zip -d data/raw
          test -f data/raw/UsedCarsSA_Clean_EN.csv
          mv data/raw/UsedCarsSA_Clean_EN.csv data/raw/saudi_used_cars.csv
      - run: python -m pip install -e .
      - run: python scripts/train.py
      - run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
      - run: docker run -d --name app -p 8000:8000 ghcr.io/${{ github.repository }}:${{ github.sha }}
      - run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/ready && exit 0 || sleep 2; done
          docker logs app
          exit 1
      - run: python scripts/smoke.py
      - name: Record image size
        run: docker image inspect ghcr.io/${{ github.repository }}:${{ github.sha }} --format '{{.Size}}' > image-size-bytes.txt
      - name: Verify image is <= 500 MB
        run: test "$(cat image-size-bytes.txt)" -le 524288000

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download public Kaggle dataset
        run: |
          mkdir -p data/raw
          curl -L --fail --retry 3 \
            https://www.kaggle.com/api/v1/datasets/download/turkibintalib/saudi-arabia-used-cars-dataset \
            -o /tmp/saudi-used-cars.zip
          unzip -o /tmp/saudi-used-cars.zip -d data/raw
          mv data/raw/UsedCarsSA_Clean_EN.csv data/raw/saudi_used_cars.csv
      - run: python -m pip install -e .
      - run: python scripts/train.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
      - run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
