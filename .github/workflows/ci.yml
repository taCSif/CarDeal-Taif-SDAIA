name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: mypy src
      - run: lint-imports
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pytest -m 'not real_model'

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Download public Kaggle dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: bash scripts/fetch_dataset.sh
      - name: Train release model
        run: python scripts/train.py
      - name: Run real-model behavior and golden tests
        run: python -m pytest -m real_model
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
      - name: Start container
        run: docker run -d --name app -p 8000:8000 ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Readiness smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/ready && exit 0 || sleep 2; done
          docker logs app
          exit 1
      - run: python scripts/smoke.py
      - name: Record image size
        run: docker image inspect ghcr.io/${{ github.repository }}:${{ github.sha }} --format '{{.Size}}' > image-size-bytes.txt
      - name: Verify image is <= 500 MB
        run: test "$(cat image-size-bytes.txt)" -le 524288000

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Download public Kaggle dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: bash scripts/fetch_dataset.sh
      - run: python scripts/train.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
      - run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
